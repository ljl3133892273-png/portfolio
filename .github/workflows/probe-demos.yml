name: probe-demos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 串行化：同一工作流不并行执行，后来者排队
concurrency:
  group: probe-demos
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe demo services
        shell: bash
        run: |
          declare -A TARGETS=(
            ["data-agent"]="http://81.70.85.14:8094/"
            ["knowledge-base"]="http://81.70.85.14:8095/"
            ["customer-service"]="http://81.70.85.14:8092/"
            ["operation-assistant"]="http://81.70.85.14:8093/"
            ["octop-plugin"]="http://81.70.85.14:8088/"
          )

          {
            echo "{"
            first=1
            for id in "${!TARGETS[@]}"; do
              url="${TARGETS[$id]}"
              if curl -sS -o /dev/null --connect-timeout 8 --max-time 12 "$url"; then
                status="true"
              else
                status="false"
              fi
              [ $first -eq 1 ] && first=0 || echo ","
              printf '  "%s": %s' "$id" "$status"
            done
            echo
            echo "}"
          } > status.json

          echo "--- 本次探测结果 ---"
          cat status.json

      - name: Commit and push status.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 有变化才提交，没变化直接退出
          git add status.json
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新演示服务在线状态 [skip ci]"

          # 带重试的推送：被拒先同步远端再推；
          # rebase 冲突只可能是 status.json（有人手动改过），一律以探测结果为准
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒，同步远端后重试 ($i/3)"
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs -- status.json
              git add status.json
              GIT_EDITOR=true git rebase --continue
            fi
            if git diff --quiet origin/main HEAD; then
              echo "远端已是最新状态"
              exit 0
            fi
          done
          echo "重试 3 次仍失败"
          exit 1
