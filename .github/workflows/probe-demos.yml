# 定时探测五个演示服务的在线状态，把结果写入 status.json。
#
# 为什么这样做：
#   作品集页面托管在 GitHub Pages（HTTPS），而五个演示服务是 http://81.70.85.14:809X。
#   浏览器里从 HTTPS 页面直接探测 HTTP 地址会被「混合内容」策略拦截，
#   所以不能在前端直接 fetch 演示地址。
#
# 解法：让 GitHub 的 runner（境外，不受混合内容限制）每 5 分钟探测一次，
#   把结果写成 status.json 提交回仓库，前端再 fetch 这个 HTTPS 的 json。
#
# 注意：
#   - 演示服务是「按需启动」的，默认不在线是正常现象，所以失败不报错、不重试。
#   - 探测结果有 5~10 分钟延迟（GitHub Actions 的 cron 最小粒度 + 运行耗时）。
#   - 用 curl 的 --connect-timeout/--max-time 兜底，避免卡死。

name: probe-demos

on:
  schedule:
    # 每 5 分钟跑一次（UTC 时间，GitHub 实际会排队，可能有几分钟延迟）
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write          # 需要写回 status.json

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe demo services
        shell: bash
        run: |
          # 五个演示服务：id -> 探测地址
          declare -A TARGETS=(
            ["data-agent"]="http://81.70.85.14:8094/"
            ["knowledge-base"]="http://81.70.85.14:8095/"
            ["customer-service"]="http://81.70.85.14:8092/"
            ["operation-assistant"]="http://81.70.85.14:8093/"
            ["octop-plugin"]="http://81.70.85.14:8088/"
          )

          echo "{"
          first=1
          for id in "${!TARGETS[@]}"; do
            url="${TARGETS[$id]}"
            # 探测：连上即算在线（不关心返回内容，只关心能否建立连接）
            if curl -sS -o /dev/null --connect-timeout 8 --max-time 12 "$url"; then
              status="true"
            else
              status="false"
            fi
            [ $first -eq 1 ] && first=0 || echo ","
            printf '  "%s": %s' "$id" "$status"
          done
          echo
          echo "}" > status.json

          echo "--- 本次探测结果 ---"
          cat status.json

      - name: Commit status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 结果没变化就不提交，避免刷屏
          if git diff --quiet status.json; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git add status.json
          git commit -m "chore: 更新演示服务在线状态 [skip ci]"
          git push
