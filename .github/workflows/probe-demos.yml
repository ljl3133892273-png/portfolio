name: probe-demos

on:
  schedule:
    # 10 分钟一次。GitHub 免费 runner 对高频定时任务限流很狠（实测 */5 会被拖到 2 小时一次），
    # 这里放宽间隔，配合页面端「数据过期就不置灰」的兜底逻辑使用。
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "status.json"

permissions:
  contents: write

# 串行化：同一工作流不并行执行，后来者排队
concurrency:
  group: probe-demos
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe demo services
        shell: bash
        run: |
          # 顺序与作品集页面上的项目顺序一致
          declare -A TARGETS=(
            ["operation-assistant"]="http://81.70.85.14:8093/"
            ["customer-service"]="http://81.70.85.14:8092/"
            ["knowledge-base"]="http://81.70.85.14:8095/"
            ["data-agent"]="http://81.70.85.14:8094/"
            ["octop-plugin"]="http://81.70.85.14:8088/"
          )

          {
            echo "{"
            first=1
            for id in "${!TARGETS[@]}"; do
              url="${TARGETS[$id]}"
              if curl -sS -o /dev/null --connect-timeout 8 --max-time 12 "$url"; then
                status="true"
              else
                status="false"
              fi
              [ $first -eq 1 ] && first=0 || printf ',\n'
              printf '  "%s": %s' "$id" "$status"
            done
            printf ',\n  "updated_at": %s\n' "$(date +%s)"
            echo "}"
          } > status.json

          echo "--- 本次探测结果 ---"
          cat status.json

      - name: Commit and push status.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add status.json

          # 提交条件（否则只更新工作区，不产生提交）：
          #   1. 任一布尔状态发生变化；
          #   2. 或距上次提交已超过 30 分钟（心跳，保证 updated_at 不至于太旧）。
          # 这样既保持数据新鲜，又不会每 10 分钟刷一条 commit。
          SHOULD=$(python3 - <<'PY'
          import json, subprocess
          new = json.load(open('status.json'))
          try:
              old = json.loads(subprocess.run(['git', 'show', 'HEAD:status.json'],
                                              capture_output=True, text=True, check=True).stdout)
          except Exception:
              old = {}
          keys = [k for k in new if k != 'updated_at']
          changed = any(new.get(k) != old.get(k) for k in keys)
          gap = int(new.get('updated_at', 0)) - int(old.get('updated_at', 0) or 0)
          print('yes' if changed or gap >= 1800 else 'no')
          PY
          )

          if [ "$SHOULD" != "yes" ]; then
            echo "状态无变化且未到心跳间隔，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新演示服务在线状态 [skip ci]"

          # 带重试的推送：被拒先同步远端再推；
          # rebase 冲突只可能是 status.json（有人手动改过），一律以探测结果为准
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒，同步远端后重试 ($i/3)"
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs -- status.json
              git add status.json
              GIT_EDITOR=true git rebase --continue
            fi
            if git diff --quiet origin/main HEAD; then
              echo "远端已是最新状态"
              exit 0
            fi
          done
          echo "重试 3 次仍失败"
          exit 1
