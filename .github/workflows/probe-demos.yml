name: probe-demos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe demo services
        shell: bash
        run: |
          declare -A TARGETS=(
            ["data-agent"]="http://81.70.85.14:8094/"
            ["knowledge-base"]="http://81.70.85.14:8095/"
            ["customer-service"]="http://81.70.85.14:8092/"
            ["operation-assistant"]="http://81.70.85.14:8093/"
            ["octop-plugin"]="http://81.70.85.14:8088/"
          )

          # 整个 JSON 一次性写入文件（重定向必须包住整个代码块）
          {
            echo "{"
            first=1
            for id in "${!TARGETS[@]}"; do
              url="${TARGETS[$id]}"
              if curl -sS -o /dev/null --connect-timeout 8 --max-time 12 "$url"; then
                status="true"
              else
                status="false"
              fi
              [ $first -eq 1 ] && first=0 || echo ","
              printf '  "%s": %s' "$id" "$status"
            done
            echo
            echo "}"
          } > status.json

          echo "--- 本次探测结果 ---"
          cat status.json

      - name: Commit status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet status.json; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git add status.json
          git commit -m "chore: 更新演示服务在线状态 [skip ci]"
          git push
